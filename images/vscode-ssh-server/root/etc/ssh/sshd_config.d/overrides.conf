Port 2222
# Disable password authentication.
PasswordAuthentication no
# Let VS Code connect to its code-server instance through the SSH tunnel.
AllowTcpForwarding yes
# Let only the dev user connect.
AllowUsers dev
# Start sessions in the /data directory.
ForceCommand bash -c 'cd /data && if [ -n "$SSH_ORIGINAL_COMMAND" ]; then eval "$SSH_ORIGINAL_COMMAND"; else exec bash; fi'

