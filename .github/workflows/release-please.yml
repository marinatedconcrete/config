---
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_pr:
        description: Recover one merged release PR. Leave empty to process pending releases.
        type: string

concurrency:
  group: release-please-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.plan.outputs.candidates }}
      errors: ${{ steps.plan.outputs.errors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.FORMWORK_REMOVER_APP_ID }}
          private-key: ${{ secrets.FORMWORK_REMOVER_PRIVATE_KEY }}
      - name: Install Release Tools
        run: npm ci --prefix .github/release --ignore-scripts
      - name: Select Release Commits
        id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: node .github/release/plan.mjs

  release:
    needs: plan
    if: needs.plan.outputs.candidates != '[]'
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJson(needs.plan.outputs.candidates) }}
    uses: ./.github/workflows/release-package.yml
    with:
      candidate: ${{ toJson(matrix.candidate) }}
    secrets: inherit

  rejected-candidates:
    needs: plan
    if: needs.plan.outputs.errors != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Report Rejected Candidates
        env:
          ERRORS: ${{ needs.plan.outputs.errors }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const errors = JSON.parse(process.env.ERRORS);
          console.error(errors.join('\n'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Rejected release candidates:\n\n' + errors.map(error => '- ' + error).join('\n') + '\n');
          process.exitCode = 1;
          JS

  update-prs:
    needs: [plan, release, rejected-candidates]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      inputs.release_pr == '' && needs.plan.result == 'success' &&
      needs.plan.outputs.errors == '[]' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.FORMWORK_REMOVER_APP_ID }}
          private-key: ${{ secrets.FORMWORK_REMOVER_PRIVATE_KEY }}
      - name: Update Release PRs
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
