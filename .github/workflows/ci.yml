---
name: Run checks
on:
  push:

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
      components: ${{ steps.paths.outputs.components }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: paths
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          KUSTOMIZATION_TESTS: |
            factorio
            kube-vip
            kube-vip-wireguard
            mosquitto
            paperless
            pod-security-audit-warn-baseline
            pod-security-audit-warn-restricted
            pod-security-enforce-baseline
            pod-security-enforce-restricted
            pod-security-enforce-privileged
            priorityclass
            unifi-network-application
        run: |
          base="$BEFORE"
          if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              base=
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH") || base=
            fi
          fi

          # Select all checks if Git cannot compare the two revisions.
          changed() {
            [[ -z "$base" ]] || ! git diff --quiet --no-renames "$base" HEAD -- "$@"
          }

          build=false
          if changed .devcontainer ansible/requirements.txt .github/workflows/ci.yml; then
            build=true
          fi

          components=()
          while IFS= read -r test; do
            paths=("kustomization/tests/$test")
            case "$test" in
              pod-security-*)
                # These tests check combinations of Pod Security components.
                paths+=(kustomization/components/pod-security kustomization/tests/pod_security.py renovate.json)
                ;;
              *) paths+=("kustomization/components/$test" kustomization/components/priorityclass) ;;
            esac
            case "$test" in
              paperless) paths+=(kustomization/components/redis) ;;
              kube-vip-wireguard) paths+=(kustomization/components/kube-vip) ;;
            esac
            if [[ "$build" == true ]] || changed "${paths[@]}" ansible justfile \
              pnpm-lock.yaml pnpm-workspace.yaml package.json ':(exclude,glob)**/*.md'; then
              components+=("$test")
            fi
          done <<< "${KUSTOMIZATION_TESTS%$'\n'}"

          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"
          jq -cn '$ARGS.positional' --args "${components[@]}" | sed 's/^/components=/' >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build devcontainer image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/marinatedconcrete/config-devcontainer
          cacheTo: ghcr.io/marinatedconcrete/config-devcontainer
          env: |
            CI=1
          imageName: ghcr.io/marinatedconcrete/config-devcontainer
          push: filter
          refFilterForPush: refs/heads/main
  check-format:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/marinatedconcrete/config-devcontainer
          env: |
            CI=1
          imageName: ghcr.io/marinatedconcrete/config-devcontainer
          push: never
          runCmd: just check-format
  kustomization-test:
    needs: [changes, build]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.components != '[]' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner can load an AppArmor profile for Mosquitto. The profile
      # then applies in the privileged test containers and blocks the
      # program. Only the Mosquitto test needs this step.
      - name: Remove Host AppArmor Profiles
        if: matrix.kustomization-test == 'mosquitto'
        run: |
          if [[ -f /etc/apparmor.d/mosquitto ]]; then
            sudo apparmor_parser --remove /etc/apparmor.d/mosquitto
          fi
      - name: Validate configs
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/marinatedconcrete/config-devcontainer
          env: |
            CI=1
          imageName: ghcr.io/marinatedconcrete/config-devcontainer
          push: never
          runCmd: just kustomization-test ${{ matrix.kustomization-test }}
    strategy:
      matrix:
        kustomization-test: ${{ fromJSON(needs.changes.outputs.components) }}
  lint:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate configs
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/marinatedconcrete/config-devcontainer
          env: |
            CI=1
          imageName: ghcr.io/marinatedconcrete/config-devcontainer
          push: never
          runCmd: just lint
