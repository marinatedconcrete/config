---
name: Build Buildah Action Runner Image

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/image-buildah-action-runner.yml
      - images/buildah-action-runner/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/image-buildah-action-runner.yml
      - images/buildah-action-runner/**
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.build-buildah-action-runner.outputs.digest }}

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/buildah-action-runner

jobs:
  build-buildah-action-runner:
    if: github.event_name != 'pull_request' && (inputs.sha != '' || github.ref == 'refs/heads/main')
    name: Build Buildah Action Runner Image
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Compute Version Tag
        env:
          BRANCH: ${{ inputs.sha && format('candidate-{0}-{1}-{2}', inputs.sha, github.run_id, github.run_attempt) || github.ref_type == 'tag' && github.ref_name || github.event_name != 'pull_request' && format('{0}.{1}.{2}', github.run_id, github.run_number, github.run_attempt) || format('pr-{0}.{1}.{2}.{3}', github.event.number, github.run_id, github.run_number, github.run_attempt) }}
        id: version_tag
        run: echo "tag=$BRANCH" | sed -e 's/buildah-action-runner-//' >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/buildah-action-runner
      - name: Build Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/buildah-action-runner
          file: images/buildah-action-runner/Containerfile
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ inputs.sha || github.sha }}
            org.opencontainers.image.version=${{ inputs.version || steps.metadata.outputs.version }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.version_tag.outputs.tag }}
  smoke:
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.build-buildah-action-runner.result == 'success') }}
    needs: build-buildah-action-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Build pull request image
        if: github.event_name == 'pull_request'
        run: docker build -f images/buildah-action-runner/Containerfile -t buildah-smoke:local images/buildah-action-runner
      - name: Load published candidate
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ needs.build-buildah-action-runner.outputs.digest }}
        run: |
          docker pull "$IMAGE_REPOSITORY@$DIGEST"
          docker tag "$IMAGE_REPOSITORY@$DIGEST" buildah-smoke:local
      - name: Smoke Test Image
        run: |
          docker run --rm buildah-smoke:local bash -lc '
            set -e
            buildah --version
            curl --version
            jq --version
            node --version
          '
          images/buildah-action-runner/smoke-test.sh buildah-smoke:local
      - name: Scan Image for Vulnerabilities
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: buildah-smoke:local
          fail-build: false
          output-format: table
