---
name: Coverage gate
on:
  push:

jobs:
  coverage-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gate needs the --test-coverage-include-all option. Node 24 does
      # not have it. The runner image can change its Node version at any time.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install Release Tools
        run: npm ci --prefix .github/release --ignore-scripts
      - name: Install Image Release Notes Tools
        run: npm ci --prefix actions/image-release-notes --ignore-scripts
      - name: Run Coverage Gate
        run: node scripts/coverage-gate.mjs --badge-file "$RUNNER_TEMP/coverage-badge.json"
      - name: Upload Coverage Badge
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage-badge.json
          if-no-files-found: error

  # This job has a write token. It runs only for a push to main, and it runs no code from a branch.
  publish-badge:
    needs: coverage-gate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download Coverage Badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}
      - name: Publish Coverage Badge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-badge.sh "$RUNNER_TEMP/coverage-badge.json"
