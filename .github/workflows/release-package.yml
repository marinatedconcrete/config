---
name: Validate and Publish Release

on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ fromJson(inputs.candidate).tag }}
  cancel-in-progress: false
  queue: max

jobs:
  recover:
    runs-on: ubuntu-latest
    outputs:
      recovered: ${{ steps.recover.outputs.recovered }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Login to GitHub Container Registry
        if: fromJson(inputs.candidate).kind == 'image'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.FORMWORK_REMOVER_APP_ID }}
          private-key: ${{ secrets.FORMWORK_REMOVER_PRIVATE_KEY }}
      - name: Recover Published Release
        id: recover
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE: ${{ inputs.candidate }}
        run: node .github/release/recover-cli.mjs

  component:
    needs: recover
    if: needs.recover.outputs.recovered == 'false' && fromJson(inputs.candidate).kind == 'component'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(inputs.candidate).sha }}
      - name: Test and Build Component
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/marinatedconcrete/config-devcontainer
          imageName: ghcr.io/marinatedconcrete/config-devcontainer
          push: never
          env: |
            CI=1
            PROJECT=${{ fromJson(inputs.candidate).project }}
            RELEASE_SHA=${{ fromJson(inputs.candidate).sha }}
            RELEASE_TAG=${{ fromJson(inputs.candidate).tag }}
          runCmd: |
            set -euo pipefail
            pnpm install --frozen-lockfile
            mkdir -p release-artifacts
            just release-please-build "$PROJECT" "$PWD/release-artifacts/$PROJECT.yml"
            manifest=false
            if [ -s "release-artifacts/$PROJECT.yml" ]; then manifest=true; fi
            jq -n --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" --argjson manifest "$manifest" \
              '{sha: $sha, tag: $tag, manifest: $manifest}' > release-artifacts/validation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ fromJson(inputs.candidate).tag }}
          overwrite: true
          path: release-artifacts/
          if-no-files-found: error

  source:
    needs: recover
    if: needs.recover.outputs.recovered == 'false' && fromJson(inputs.candidate).kind == 'source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(inputs.candidate).sha }}
      - name: Validate Source Release
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          cacheFrom: ghcr.io/marinatedconcrete/config-devcontainer
          imageName: ghcr.io/marinatedconcrete/config-devcontainer
          push: never
          env: |
            CI=1
          runCmd: pnpm install --frozen-lockfile && just check-format && just lint && just test

  kairos-fedora:
    needs: recover
    if: needs.recover.outputs.recovered == 'false' && fromJson(inputs.candidate).project == 'kairos-fedora'
    uses: ./.github/workflows/image-kairos-fedora.yml
    with:
      sha: ${{ fromJson(inputs.candidate).sha }}
      version: ${{ fromJson(inputs.candidate).version }}
    secrets: inherit

  buildah-action-runner:
    needs: recover
    if: needs.recover.outputs.recovered == 'false' && fromJson(inputs.candidate).project == 'buildah-action-runner'
    uses: ./.github/workflows/image-buildah-action-runner.yml
    with:
      sha: ${{ fromJson(inputs.candidate).sha }}
      version: ${{ fromJson(inputs.candidate).version }}
    secrets: inherit

  github-runner-ci:
    needs: recover
    if: needs.recover.outputs.recovered == 'false' && fromJson(inputs.candidate).project == 'github-runner-ci'
    uses: ./.github/workflows/image-github-runner-ci.yml
    with:
      sha: ${{ fromJson(inputs.candidate).sha }}
      version: ${{ fromJson(inputs.candidate).version }}
    secrets: inherit

  vscode-ssh-server:
    needs: recover
    if: needs.recover.outputs.recovered == 'false' && fromJson(inputs.candidate).project == 'vscode-ssh-server'
    uses: ./.github/workflows/image-vscode-ssh-server.yml
    with:
      sha: ${{ fromJson(inputs.candidate).sha }}
      version: ${{ fromJson(inputs.candidate).version }}
    secrets: inherit

  publish:
    needs: [recover, component, source, kairos-fedora, buildah-action-runner, github-runner-ci, vscode-ssh-server]
    if: >-
      always() && !cancelled() && needs.recover.outputs.recovered == 'false' &&
      (needs.component.result == 'success' || needs.source.result == 'success' ||
      needs.kairos-fedora.result == 'success' || needs.buildah-action-runner.result == 'success' ||
      needs.github-runner-ci.result == 'success' || needs.vscode-ssh-server.result == 'success') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Use the workflow commit so recovery can use publication fixes.
        with:
          ref: ${{ github.sha }}
      - name: Download Validated Component
        if: fromJson(inputs.candidate).kind == 'component'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ fromJson(inputs.candidate).tag }}
          path: artifacts
      - name: Login to GitHub Container Registry
        if: fromJson(inputs.candidate).kind == 'image'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.FORMWORK_REMOVER_APP_ID }}
          private-key: ${{ secrets.FORMWORK_REMOVER_PRIVATE_KEY }}
      - name: Publish Validated Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE: ${{ inputs.candidate }}
          IMAGE_DIGEST: ${{ needs.kairos-fedora.outputs.digest || needs.buildah-action-runner.outputs.digest || needs.github-runner-ci.outputs.digest || needs.vscode-ssh-server.outputs.digest }}
        run: node .github/release/publish-cli.mjs
