---
name: Build Kairos-Fedora

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/image-kairos-fedora.yml
      - actions/image-release-notes/**
      - images/kairos-fedora/**
      - justfile
  pull_request:
    branches:
      - main
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/image-kairos-fedora.yml
      - actions/image-release-notes/**
      - images/kairos-fedora/**
      - justfile
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.build-container.outputs.digest }}
      release-notes-artifact:
        value: ${{ jobs.build-container.outputs.release-notes-artifact }}


jobs:
  build-container:
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      release-notes-artifact: ${{ steps.release_notes.outputs.artifact-name }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Use a temporary image tag for release validation.
      - name: Compute Version Tag
        env:
          BRANCH: ${{ inputs.sha && format('candidate-{0}-{1}-{2}', inputs.sha, github.run_id, github.run_attempt) || github.ref_type == 'tag' && github.ref_name || github.event_name == 'pull_request' && format('{0}-pr', github.event.number) || format('{0}.{1}.{2}', github.run_id, github.run_number, github.run_attempt) }}
        id: version_tag
        run: echo "tag=$BRANCH" | sed -e 's/kairos-fedora-//' >> "$GITHUB_OUTPUT"
      - name: Generate Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/kairos-fedora
      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            VERSION=${{ inputs.version || steps.version_tag.outputs.tag }}
          context: images/kairos-fedora
          file: images/kairos-fedora/Containerfile
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ inputs.sha || github.sha }}
            org.opencontainers.image.version=${{ inputs.version || steps.metadata.outputs.version }}
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/kairos-fedora:${{ steps.version_tag.outputs.tag }}
      - name: Install E2E Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes curl openssh-client ovmf qemu-system-x86 qemu-utils
      - name: Enable KVM Access
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      # The runner is an Azure VM, and QEMU user networking connects as the
      # runner user. Without this rule, the Kairos Azure datasource reads the
      # runner metadata and changes the guest hostname.
      - name: Block the Instance Metadata Service for the E2E VM
        run: sudo iptables -I OUTPUT -d 169.254.169.254 -m owner --uid-owner "$(id -u)" -j REJECT
      - name: Run Kairos Fedora E2E
        env:
          KAIROS_IMAGE: ghcr.io/${{ github.repository_owner }}/kairos-fedora:${{ steps.version_tag.outputs.tag }}
        run: bash images/kairos-fedora/e2e.sh
      - name: Upload E2E Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kairos-fedora-e2e-${{ inputs.sha || github.sha }}
          path: |
            build/e2e/kairos-fedora/install-cloud-config.yaml
            build/e2e/kairos-fedora/id_ed25519.pub
            build/e2e/kairos-fedora/logs
          if-no-files-found: ignore
      - name: Push Image
        if: inputs.sha != ''
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kairos-fedora:${{ steps.version_tag.outputs.tag }}
        run: |
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      # Generate the complete notes for each build. A pull request then shows
      # the notes and the package changes in the job summary and in an artifact.
      # A release run publishes the artifact after it creates the release.
      - name: Generate Image Release Notes
        id: release_notes
        uses: ./actions/image-release-notes
        with:
          artifact-name: kairos-fedora-release-notes${{ inputs.version && format('-{0}', inputs.version) || '' }}
          component: kairos-fedora
          components-script: images/kairos-fedora/release-notes-components.sh
          highlight-packages: kernel systemd
          image: ghcr.io/${{ github.repository_owner }}/kairos-fedora:${{ steps.version_tag.outputs.tag }}
          tag: ${{ inputs.version && format('kairos-fedora-{0}', inputs.version) || '' }}
          version: ${{ inputs.version }}
