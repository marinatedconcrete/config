---
name: Build VSCode SSH Server

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/image-vscode-ssh-server.yml
      - images/vscode-ssh-server/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/image-vscode-ssh-server.yml
      - images/vscode-ssh-server/**
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.build-container.outputs.digest }}


jobs:
  build-container:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute Version Tag
        env:
          BRANCH: ${{ inputs.sha && format('candidate-{0}-{1}-{2}', inputs.sha, github.run_id, github.run_attempt) || github.ref_type == 'tag' && github.ref_name || github.event_name != 'pull_request' && format('{0}.{1}.{2}', github.run_id, github.run_number, github.run_attempt) || format('{0}-pr', github.event.number) }}
        id: version_tag
        run: echo "tag=$BRANCH" | sed -e 's/vscode-ssh-server-//' >> "$GITHUB_OUTPUT"
      - name: Generate Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/vscode-ssh-server
      - name: Build Image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            VERSION=${{ inputs.version || steps.version_tag.outputs.tag }}
          context: images/vscode-ssh-server
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ inputs.sha || github.sha }}
            org.opencontainers.image.version=${{ inputs.version || steps.metadata.outputs.version }}
          push: ${{ inputs.sha != '' }}
          load: ${{ inputs.sha == '' }}
          tags: ghcr.io/${{ github.repository_owner }}/vscode-ssh-server:${{ steps.version_tag.outputs.tag }}
      - name: Smoke Test Image
        run: |
          docker run --rm --entrypoint /bin/sh ghcr.io/${{ github.repository_owner }}/vscode-ssh-server:${{ steps.version_tag.outputs.tag }} -ec '
            test -x /init.sh
            test -x /usr/sbin/sshd
            id dev
          '
