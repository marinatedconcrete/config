---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
    spec:
      automountServiceAccountToken: false
      priorityClassName: application-infra
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      containers:
        - name: authelia
          image: authelia/authelia
          command:
            - /app/authelia
          args:
            - --config
            - /config/configuration.yml
          env:
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /config/storage-encryption-key
          ports:
            - name: http
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: authelia-config
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data
