apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperless
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  serviceName: paperless
  template:
    metadata:
      annotations:
        # Patches can change the order of the containers.
        kubectl.kubernetes.io/default-container: paperless
      labels:
        app.kubernetes.io/name: paperless
    spec:
      hostUsers: false
      priorityClassName: critical-application
      volumes:
        - name: paperless-data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: paperless-consume
          persistentVolumeClaim:
            claimName: paperless-consume
        - name: paperless-export
          persistentVolumeClaim:
            claimName: paperless-export
      initContainers:
        # Create the trash directory before Paperless starts.
        - name: prep-trash-dir
          image: ghcr.io/paperless-ngx/paperless-ngx
          command:
            - /bin/sh
            - -c
            - mkdir -p $PAPERLESS_TRASH_DIR
          env:
            - name: PAPERLESS_TRASH_DIR
              value: "/usr/src/paperless/media/trash"
          volumeMounts:
            - mountPath: "/usr/src/paperless/media"
              name: paperless-media
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx
          ports:
            - containerPort: 8000
          env:
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_REDIS
              value: "redis://redis-svc:6379"
            - name: PAPERLESS_TIME_ZONE
              value: America/Los_Angeles
            - name: PAPERLESS_AUTO_LOGIN_USERNAME
              value: admin
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_DATE_ORDER
              value: MDY
            - name: PAPERLESS_FILENAME_FORMAT
              value: "{{ correspondent }}/{{ created_year }}/{{ created_year }}-{{ created_month }}-{{ created_day }} {{ title }}"
            - name: PAPERLESS_TRASH_DIR
              value: "/usr/src/paperless/media/trash"
            - name: PAPERLESS_IGNORE_DATES
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: ignored_dates
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless_admin_password
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless_secret_key
            - name: PAPERLESS_TASK_WORKERS
              value: "2"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 200Mi
            limits:
              cpu: 3000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
          startupProbe:
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            # The image starts as root.  It changes file owners and then runs
            # Paperless as UID 1000.
            capabilities:
              add:
                - CHOWN
                - SETGID
                - SETUID
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: "/usr/src/paperless/data"
              name: paperless-data
            - mountPath: "/usr/src/paperless/media"
              name: paperless-media
            - mountPath: "/usr/src/paperless/export"
              name: paperless-export
            - mountPath: "/usr/src/paperless/consume"
              name: paperless-consume
        - name: samba
          image: ghcr.io/servercontainers/samba:smbd-only-latest
          ports:
            - containerPort: 4450
              name: smb
          env:
            - name: ACCOUNT_printer
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: printer_samba_password
            # Paperless runs as UID 1000 and owns the consume directory.  The
            # printer account must use the same UID to write there.
            - name: UID_printer
              value: "1000"
            # Port 4450 is above 1023, so smbd needs no NET_BIND_SERVICE.
            - name: SAMBA_GLOBAL_CONFIG_smb_SPACE_ports
              value: "4450"
            - name: SAMBA_VOLUME_CONFIG_scans
              value: "[Scans]; path=/shares/scans; valid users = printer; guest ok = no; read only = no; browseable = no"
          resources:
            limits:
              cpu: 100m
              memory: 1Gi
            requests:
              cpu: 25m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            # smbd starts as root and changes to the user of each connection.
            capabilities:
              add:
                - SETGID
                - SETUID
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: "/shares/scans"
              name: paperless-consume
