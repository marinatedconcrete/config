---
frigate:
  level: baseline
  reason: The Frigate container starts as root to set the user IDs of its services.
kube-vip:
  level: privileged
  reason: The DaemonSets use hostNetwork and the NET_ADMIN and NET_RAW capabilities.
kube-vip-wireguard:
  level: privileged
  reason: The DaemonSet uses hostNetwork and the NET_ADMIN and NET_RAW capabilities.
paperless:
  level: baseline
  reason: The paperless container adds the CHOWN, SETGID, and SETUID capabilities. The samba container adds the SETGID and SETUID capabilities.
unifi-network-application:
  level: baseline
  reason: The unifi container adds the CHOWN, DAC_OVERRIDE, SETGID, and SETUID capabilities.
