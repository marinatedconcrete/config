---
# Components that do not meet the Pod Security restricted level.
# The level is exact. The check fails when the measured level is different.
kube-vip:
  level: privileged
  reason: The DaemonSets use hostNetwork and the NET_ADMIN and NET_RAW capabilities.
kube-vip-wireguard:
  level: privileged
  reason: The DaemonSet uses hostNetwork and the NET_ADMIN and NET_RAW capabilities.
paperless:
  level: baseline
  reason: The paperless and samba containers add the CHOWN, SETGID, and SETUID capabilities.
unifi-network-application:
  level: baseline
  reason: The container adds the CHOWN, DAC_OVERRIDE, SETGID, and SETUID capabilities.
