---
- connection: local
  gather_facts: false
  hosts: localhost
  name: Check the egress-public-internet component
  tasks:
    - ansible.builtin.include_tasks: ../egress-assertions.yml
      name: Check the component
  vars:
    expected_policies:
      allow-egress-public-internet-networkpolicy:
        egress:
          - ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 0.0.0.0/8
                    - 10.0.0.0/8
                    - 100.64.0.0/10
                    - 127.0.0.0/8
                    - 169.254.0.0/16
                    - 172.16.0.0/12
                    - 192.0.0.0/24
                    - 192.0.2.0/24
                    - 192.88.99.0/24
                    - 192.168.0.0/16
                    - 198.18.0.0/15
                    - 198.51.100.0/24
                    - 203.0.113.0/24
                    - 224.0.0.0/4
                    - 240.0.0.0/4
        podSelector:
          matchLabels:
            networking.marinatedconcrete.com/internet-client: "true"
        policyTypes:
          - Egress
