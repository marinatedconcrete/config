---
- name: Validate k3s-egress-kubernetes-api rendering
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    expected_egress:
      allow-egress-kubernetes-api: []
  tasks:
    - name: Check default render
      ansible.builtin.include_tasks: ../k3s-egress-assertions.yml
    - name: Check documented custom networking example
      ansible.builtin.include_tasks: ../k3s-egress-custom.yml
