---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-config
stringData:
  configuration.yml: |
    authentication_backend:
      password_reset:
        disable: true
      file:
        path: /config/users.yml
    access_control:
      default_policy: deny
      rules:
        - domain: app.example.com
          policy: one_factor
    session:
      cookies:
        - domain: example.com
          authelia_url: https://auth.example.com
    storage:
      local:
        path: /data/db.sqlite3
    notifier:
      filesystem:
        filename: /data/notifications.txt
  users.yml: |
    users:
      test:
        displayname: Test User
        password: '$2b$12$abcdefghijklmnopqrstuu0yWbeYsvlHyMIaczgb9onctGqJI5TYG'
        email: test@example.com
  storage-encryption-key: authelia-integration-test-storage-key
