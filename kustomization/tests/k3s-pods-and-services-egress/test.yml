---
- name: Validate k3s-pods-and-services-egress rendering
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    expected_egress:
      pods-and-services-egress:
        - to:
            - ipBlock:
                cidr: 10.42.0.0/16
        - to:
            - ipBlock:
                cidr: 10.43.0.0/16
  tasks:
    - name: Check default render
      ansible.builtin.include_tasks: ../k3s-egress-assertions.yml
    - name: Check documented custom networking example
      ansible.builtin.include_tasks: ../k3s-egress-custom.yml
