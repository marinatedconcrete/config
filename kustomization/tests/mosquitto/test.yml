---
- name: Mosquitto Tests
  gather_facts: false
  hosts: localhost
  roles:
    - role: marinatedconcrete.config.minikube_test
      vars:
        minikube_test__enable_local_path_storage: true
        minikube_test__test_dir: kustomization/tests/mosquitto
  tasks:
    - name: Wait for the StatefulSet replica to become ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        context: "{{ kubernetes_core_k8s__context }}"
        kind: StatefulSet
        name: mosquitto-statefulset
        namespace: "{{ test_namespace }}"
      register: mosquitto_statefulset
      until:
        - mosquitto_statefulset.resources | length == 1
        - (mosquitto_statefulset.resources | first).status.readyReplicas | default(0) == 1
      retries: 60
      delay: 5
    - name: Get endpoints information
      kubernetes.core.k8s_info:
        api_version: v1
        context: "{{ kubernetes_core_k8s__context }}"
        kind: Endpoints
        name: mosquitto-svc
        namespace: "{{ test_namespace }}"
      register: endpoints
    - name: Ensure the endpoint is in a good state
      ansible.builtin.assert:
        that:
          - endpoints.resources | length | bool # Check that an endpoint exists.
          - (endpoints.resources | first).subsets | length | bool
  vars:
    kubernetes_core_k8s__context: mosquitto
    test_namespace: "{{ (lookup('file', 'kustomization.yml') | from_yaml).namespace }}"
