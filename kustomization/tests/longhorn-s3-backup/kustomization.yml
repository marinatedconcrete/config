---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../components/longhorn/s3-backup
namespace: longhorn-test
patches:
  - target:
      group: longhorn.io
      kind: BackupTarget
      name: s3
    patch: |-
      - op: replace
        path: /spec/backupTargetURL
        value: s3://backup-test@us-east-1/
