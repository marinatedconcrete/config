---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-private-egress
spec:
  podSelector:
    matchLabels:
      app: example
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.22.0.50/32
      ports:
        - protocol: TCP
          port: 443
